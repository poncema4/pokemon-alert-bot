name: Pokemon Stock Monitor

on:
  schedule:
    # Runs every 5 minutes. GitHub's actual trigger time can lag a few
    # extra minutes during high load - this is a GitHub limitation, not
    # something a workflow setting can fix.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}  # lets you manually trigger a run from the GitHub UI

jobs:
  check-stock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run stock check
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python monitor.py

      - name: Commit updated state
        run: |
          git config --global user.name "stock-bot"
          git config --global user.email "stock-bot@users.noreply.github.com"
          git add state.json || true
          git diff --quiet --cached || git commit -m "Update stock state [skip ci]"
          git push || true
