name: Pokemon Stock Monitor

on:
  push:
    branches: [main]
    paths:
      - "bot/**"
      - "tools/**"
      - "tests/**"
      - "docs/**/*.js"
      - "config/**"
      - "requirements.txt"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "bot/**"
      - "tools/**"
      - "tests/**"
      - "docs/**"
      - "config/**"
      - "requirements.txt"
      - ".github/workflows/**"
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  # The watcher has its own group. It used to share one with the test runs on push, and GitHub keeps only ONE pending run per group:
  # every merge to main queued a test run that replaced the watcher's pending handover, so the watcher chain broke and the data went stale.
  group: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'pokeping-watcher' || format('pokeping-tests-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Install the browser for the real-browser tests
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Run deterministic tests
        env:
          POKEPING_REQUIRE_BROWSER: "1"
        run: python -u tests/test_accuracy.py
      - name: Run the end-to-end test (restock -> Discord -> website)
        env:
          POKEPING_REQUIRE_BROWSER: "1"
        run: python -u tests/test_end_to_end.py
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run web helper tests
        run: |
          node tests/web/common.test.js
      - name: Compile production Python
        run: python -m py_compile bot/*.py tools/*.py tests/test_accuracy.py

  check-stock:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 62
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Install the browser (Best Buy is read in a real browser)
        continue-on-error: true  # if this fails the watcher still runs; only Best Buy is skipped
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Watch stock for about 55 minutes (checks every 30 seconds)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_PING: ${{ secrets.DISCORD_PING }}
          MONITOR_RUNTIME_SECONDS: "3300"
          POKEPING_BROWSER: "1"
          BESTBUY_API_KEY: ${{ secrets.BESTBUY_API_KEY }}
        run: |
          python --version
          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            echo "Discord webhook secret is configured."
          else
            echo "WARNING: DISCORD_WEBHOOK_URL is not configured; alerts will be skipped."
          fi
          python -u bot/monitor_loop.py
      - name: Hand over to the next watcher
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run monitor.yml --ref main || echo "dispatch failed; the 30-minute cron will restart the watcher"
