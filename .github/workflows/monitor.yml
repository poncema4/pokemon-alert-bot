name: Pokemon Stock Monitor

on:
  schedule:
    # GitHub's fastest supported cron cadence. Scheduled workflows can still be
    # delayed by GitHub during load, but this requests a check every 5 minutes.
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      send_test_alert:
        description: "Send one labeled Discord and map test alert"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: pokemon-stock-monitor
  cancel-in-progress: false

jobs:
  check-stock:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run stock check
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_PING: ${{ secrets.DISCORD_PING }}
          SEND_TEST_ALERT: ${{ inputs.send_test_alert }}
        run: |
          python --version
          python -m py_compile monitor.py notify.py
          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            echo "Discord webhook secret is configured."
          else
            echo "WARNING: DISCORD_WEBHOOK_URL is not configured; alerts will be skipped."
          fi
          python -u monitor.py

      - name: Save state and map pings
        run: |
          git config user.name "Pokémon Alert Bot"
          git config user.email "pokemon-alert-bot@users.noreply.github.com"
          git add state.json docs/alerts.json
          git diff --quiet --cached || git commit -m "Update stock state [skip ci]"
          git push
