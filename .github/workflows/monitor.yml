name: Pokemon Stock Monitor

on:
  schedule:
    # Fastest GitHub cron. Actual fire time can lag several minutes.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check-stock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run stock check
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_PING: ${{ secrets.DISCORD_PING }}
        run: python monitor.py

      - name: Save state and map pings
        run: |
          git config user.name "stock-bot"
          git config user.email "stock-bot@users.noreply.github.com"
          git add state.json docs/alerts.json
          git diff --quiet --cached || git commit -m "Update stock state [skip ci]"
          git push
