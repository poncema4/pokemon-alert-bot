name: Pokemon Stock Monitor

on:
  push:
    branches: [main]
    paths:
      - "*.py"
      - "tests/**"
      - "search_config.json"
      - "requirements.txt"
      - ".github/workflows/**"
  schedule:
    - cron: "2/5 * * * *"
  workflow_dispatch:
    inputs:
      send_test_alert:
        description: "Send one labeled Discord and map test alert"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: pokemon-stock-monitor
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run deterministic tests
        run: python -u tests/test_accuracy.py
      - name: Compile production Python
        run: python -m py_compile monitor.py notify.py notify_new_listings.py refresh_live_hits.py accuracy.py bootstrap_stock_alerts.py update_30th_prices.py tests/test_accuracy.py

  check-stock:
    if: github.event_name != 'push'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Normalize missed first-stock alerts
        run: python -u bootstrap_stock_alerts.py
      - name: Run stock check
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_PING: ${{ secrets.DISCORD_PING }}
          SEND_TEST_ALERT: ${{ inputs.send_test_alert }}
        run: |
          python --version
          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            echo "Discord webhook secret is configured."
          else
            echo "WARNING: DISCORD_WEBHOOK_URL is not configured; alerts will be skipped."
          fi
          python -u monitor.py
      - name: Refresh verified live hits for map
        run: python -u refresh_live_hits.py
      - name: Alert on newly discovered Big 4 listings
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_PING: ${{ secrets.DISCORD_PING }}
        run: python -u notify_new_listings.py
      - name: Save state and map pings
        run: |
          git config user.name "Pokémon Alert Bot"
          git config user.email "pokemon-alert-bot@users.noreply.github.com"
          git add state.json docs/alerts.json
          git diff --quiet --cached || git commit -m "Update stock state [skip ci]"
          git push
