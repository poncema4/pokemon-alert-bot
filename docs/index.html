<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pokémon Restock Radar — North Jersey</title>
  <link rel="icon" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/site.css">
  <link rel="stylesheet" href="css/map.css">
</head>
<body class="map-page">
  <header class="topbar">
    <div class="brand">Restock Radar</div>
    <div class="lamps" id="lamps" aria-label="Which retailers the bot can currently read"></div>
    <nav class="nav" aria-label="Pages">
      <a href="index.html" aria-current="page">Map</a>
      <a href="route.html">Route</a>
      <a href="30th.html">30th guide</a>
    </nav>
  </header>

  <div class="layout">
    <aside class="rail" aria-label="Live hits and nearby stores">
      <section aria-labelledby="live-title">
        <div class="rail-head"><h2 id="live-title">Live online</h2><span id="checked" class="muted"></span></div>
        <div id="live"></div>
      </section>
      <section aria-labelledby="near-title">
        <div class="rail-head"><h2 id="near-title">Stores near you</h2><button class="btn" id="locate" type="button">Use my location</button></div>
        <form class="home" id="home-form">
          <label for="home-input" class="sr-only">Your home address</label>
          <input id="home-input" type="text" autocomplete="street-address" placeholder="Set your home: street, town">
          <button class="btn" type="submit">Set home</button>
        </form>
        <p class="muted" id="home-note"></p><button class="btn" id="home-clear" type="button" hidden>Use the town centre instead</button>
        <div class="chips" id="chips" role="group" aria-label="Filter stores"></div>
        <div id="stores"></div>
      </section>
    </aside>
    <main id="map" aria-label="Map of stores"></main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/common.js"></script>
  <script src="js/map.js"></script>
</body>
</html>
