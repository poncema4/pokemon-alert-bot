<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>North Jersey Pokémon Snipe Map</title><link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
:root{--bg:#0f1115;--panel:#171a21;--line:#2a3140;--text:#eef1f6;--muted:#a6afbe;--accent:#e3350d;--gold:#ffcb05;--open:#34d27b;--closed:#f04444}*{box-sizing:border-box}html,body{height:100%;margin:0}body{font:14px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);overflow:hidden}header{height:72px;padding:13px 16px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#1c1410,var(--bg))}h1{font-size:1.1rem;margin:0 0 3px}.sub,.meta{color:var(--muted);font-size:.8rem}.sub{margin:0}.layout{display:grid;grid-template-columns:350px minmax(0,1fr);height:calc(100% - 72px)}aside{min-height:0;overflow-y:auto;border-right:1px solid var(--line);background:var(--panel)}#map{min-width:0;height:100%;background:#dce6ee}.filters,.legend{display:flex;flex-wrap:wrap;gap:6px;padding:10px 10px 0}.legend{padding-top:8px;color:var(--muted);font-size:.75rem}.legend span{display:inline-flex;align-items:center;gap:4px}button.filter{padding:6px 10px;color:var(--text);background:#222733;border:1px solid var(--line);border-radius:999px;cursor:pointer}button.filter.active{background:var(--accent);border-color:var(--accent)}.card{width:calc(100% - 20px);margin:10px;padding:10px;text-align:left;color:var(--text);background:#12151c;border:1px solid var(--line);border-radius:10px}button.card{cursor:pointer;font:inherit}button.card:hover,button.card:focus{border-color:var(--gold);outline:none}.card h3{margin:0 0 4px;font-size:.92rem}.card p{margin:8px 0 0;font-size:.83rem}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}.open{background:var(--open)}.closed{background:var(--closed)}.ping{background:var(--gold);border:2px solid var(--accent)}.directions{display:inline-block;margin-top:9px;padding:6px 8px;color:#151515!important;background:var(--gold);border-radius:5px;text-decoration:none;font-size:.78rem;font-weight:700}.note{margin:10px;padding:9px 10px;color:var(--muted);background:#12151c;border-left:3px solid var(--gold);border-radius:5px;font-size:.8rem}@media(max-width:800px){body{overflow:auto}header{height:auto}.layout{grid-template-columns:1fr;height:auto}aside{max-height:44vh}#map{height:56vh;min-height:360px}}
</style></head><body>
<header><h1>North Jersey Pokemon Snipe Map</h1><p class="sub">North Arlington home base - click a store card to zoom in. Rings mean a recent alert.</p></header>
<div class="layout"><aside><div class="filters"><button class="filter active" data-kind="all">All</button><button class="filter" data-kind="alerts">Alerts</button><button class="filter" data-kind="target">Target</button><button class="filter" data-kind="walmart">Walmart</button><button class="filter" data-kind="bestbuy">Best Buy</button><button class="filter" data-kind="lgs">Shops</button></div><div class="legend"><span><i class="dot open"></i>Open now</span><span><i class="dot closed"></i>Closed</span><span><i class="dot ping"></i>Recent alert ring</span></div><div id="list"></div></aside><div id="map"></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const home=[40.7884,-74.1332],map=L.map('map',{worldCopyJump:true}).setView(home,12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);let filterKind='all',stores=[],alerts=[],layers=[],markers={};const retailColors={target:'#cc0000',walmart:'#0071ce',bestbuy:'#0046be',gamestop:'#333',lgs:'#b8860b',pokemoncenter:'#e3350d',promo:'#8e44ad'};
function minutesNowET(){const p=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date());return Number(p.find(x=>x.type==='hour').value)*60+Number(p.find(x=>x.type==='minute').value)}function isOpen(s){const n=minutesNowET(),[oh,om]=s.open.split(':').map(Number),[ch,cm]=s.close.split(':').map(Number);return n>=oh*60+om&&n<ch*60+cm}function visible(s){if(filterKind==='all'||filterKind==='alerts')return true;if(filterKind==='lgs')return['lgs','pokemoncenter','gamestop'].includes(s.retailer);return s.retailer===filterKind}function directions(s){return`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(s.name+' '+s.address)}`}function clear(){layers.forEach(x=>map.removeLayer(x));layers=[];markers={}}function marker(lat,lng,opts,popup){const m=L.circleMarker([lat,lng],opts).addTo(map);if(popup)m.bindPopup(popup);layers.push(m);return m}function zoomTo(s){map.flyTo([s.lat,s.lng],15,{duration:.55});markers[s.id]?.openPopup()}function storeCard(s){const open=isOpen(s),b=document.createElement('button');b.className='card';b.innerHTML=`<h3><span class="dot ${open?'open':'closed'}"></span>${s.name}</h3><div class="meta">${s.address}<br>${s.hours} - ${open?'open now (approx)':'closed (approx)'}</div><p>${s.notes||''}</p><a class="directions" href="${directions(s)}" target="_blank" rel="noopener">Get directions</a>`;b.onclick=e=>{if(!e.target.closest('a'))zoomTo(s)};return b}
function render(){clear();const list=document.querySelector('#list');list.innerHTML='';marker(home[0],home[1],{radius:10,color:'#a97d00',fillColor:'#ffcb05',fillOpacity:.95,weight:2},'<b>You - North Arlington</b>');const shown=stores.filter(visible);shown.forEach(s=>{const open=isOpen(s),c=retailColors[s.retailer]||'#777';markers[s.id]=marker(s.lat,s.lng,{radius:9,color:c,fillColor:c,fillOpacity:.9,weight:2},`<b>${s.name}</b><br>${s.address}<br>${s.hours}<br><b style="color:${open?'#168743':'#c52222'}">${open?'Open now (approx)':'Closed (approx)'}</b><br>${s.notes||''}<br><a class="directions" href="${directions(s)}" target="_blank" rel="noopener">Get directions</a>`)});const shownAlerts=alerts.filter(a=>filterKind==='all'||filterKind==='alerts'||a.retailer===filterKind);shownAlerts.forEach(a=>(a.stores||[]).forEach(p=>marker(p.lat,p.lng,{radius:17,color:'#e3350d',fillColor:'#ffcb05',fillOpacity:.3,weight:3},`<b>ALERT - ${a.kind.toUpperCase()}</b><br>${a.title}<br><a href="${a.url}" target="_blank" rel="noopener">Open listing</a><br>${new Date(a.ts).toLocaleString()}`)));if(filterKind==='alerts'||filterKind==='all'){if(!shownAlerts.length)list.append(Object.assign(document.createElement('div'),{className:'note',textContent:'No alerts yet. A ring appears here and on the map after a deal, promo, restock, or a manual test.'}));shownAlerts.slice(0,5).forEach(a=>{const e=document.createElement('div');e.className='card';e.innerHTML=`<h3><span class="dot ping"></span>${a.kind.toUpperCase()} - ${a.retailer}</h3><div class="meta">${new Date(a.ts).toLocaleString()}</div><p>${a.title}</p>`;list.append(e)})}if(filterKind!=='alerts')shown.slice(0,12).forEach(s=>list.append(storeCard(s)));map.fitBounds([home,...shown.map(s=>[s.lat,s.lng])],{padding:[38,38],maxZoom:12});setTimeout(()=>map.invalidateSize(),100)}document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');filterKind=b.dataset.kind;render()});Promise.all([fetch('stores.json').then(r=>r.json()),fetch('alerts.json').then(r=>r.json()).catch(()=>[])]).then(([s,a])=>{stores=s.stores||[];alerts=a||[];render()}).catch(()=>document.querySelector('#list').innerHTML='<div class="note">Could not load map data. Refresh once.</div>');
</script></body></html>
