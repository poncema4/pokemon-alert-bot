<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>North Jersey Pokémon Live Hits</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{margin:0;font:14px system-ui;background:#0f1115;color:#eef1f6}header{padding:14px;border-bottom:1px solid #2a3140}.layout{display:grid;grid-template-columns:350px 1fr;height:calc(100vh - 60px)}aside{overflow:auto;background:#171a21}.filters{display:flex;flex-wrap:wrap;gap:6px;padding:10px}.filter{padding:6px 10px;background:#222733;color:#eef1f6;border:1px solid #2a3140;border-radius:999px}.active{background:#e3350d}.legend,.note,.card{margin:10px}.legend,.note{color:#a6afbe}.card{padding:10px;background:#12151c;border:1px solid #2a3140;border-radius:10px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}.open{background:#34d27b}.closed{background:#f04444}.ping{background:#ffcb05;border:2px solid #e3350d}.meta{color:#a6afbe;font-size:.8rem}.directions{display:inline-block;margin-top:8px;padding:6px;background:#ffcb05;color:#151515;text-decoration:none;border-radius:5px}#map{height:100%}@media(max-width:800px){.layout{grid-template-columns:1fr}aside{max-height:45vh}#map{height:55vh}}</style></head><body><header><b>North Jersey Pokémon Live-Hit Map</b><div class="meta">Only live qualifying alerts are ringed. Test alerts and expired hits are hidden automatically.</div></header><div class="layout"><aside><div class="filters"><button class="filter active" data-kind="all">All</button><button class="filter" data-kind="alerts">Live Hits</button><button class="filter" data-kind="target">Target</button><button class="filter" data-kind="walmart">Walmart</button><button class="filter" data-kind="bestbuy">Best Buy</button><button class="filter" data-kind="gamestop">GameStop</button></div><div class="legend"><span><i class="dot open"></i>Store</span> <span><i class="dot ping"></i>Live hit</span></div><div id="list"></div></aside><div id="map"></div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const home=[40.7884,-74.1332],map=L.map('map').setView(home,12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);let filterKind='all',stores=[],alerts=[],layers=[];const colors={target:'#cc0000',walmart:'#0071ce',bestbuy:'#0046be',gamestop:'#333',lgs:'#b8860b',pokemoncenter:'#e3350d',promo:'#8e44ad'};function clear(){layers.forEach(x=>map.removeLayer(x));layers=[]}function marker(lat,lng,opts,popup){const m=L.circleMarker([lat,lng],opts).addTo(map);if(popup)m.bindPopup(popup);layers.push(m)}function live(a){return a&&a.kind!=='test'&&((a.expires_at&&new Date(a.expires_at)>new Date())||(!a.expires_at&&Date.now()-new Date(a.ts).getTime()<90*60*1000))}function visible(s){if(filterKind==='all'||filterKind==='alerts')return true;return s.retailer===filterKind}function directions(s){return 'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(s.name+' '+s.address)}function render(){clear();const list=document.querySelector('#list');list.innerHTML='';marker(home[0],home[1],{radius:10,color:'#a97d00',fillColor:'#ffcb05',fillOpacity:.95},'<b>You — North Arlington</b>');const shown=stores.filter(visible);shown.forEach(s=>{const c=colors[s.retailer]||'#777';marker(s.lat,s.lng,{radius:9,color:c,fillColor:c,fillOpacity:.9},'<b>'+s.name+'</b><br>'+s.address+'<br><a class="directions" href="'+directions(s)+'" target="_blank">Directions</a>')});const hits=alerts.filter(live).filter(a=>filterKind==='all'||filterKind==='alerts'||a.retailer===filterKind);hits.forEach(a=>(a.stores||[]).forEach(p=>marker(p.lat,p.lng,{radius:17,color:'#e3350d',fillColor:'#ffcb05',fillOpacity:.3,weight:3},'<b>LIVE HIT — '+a.kind.toUpperCase()+'</b><br>'+a.title+'<br><a href="'+a.url+'" target="_blank">Open listing</a><br>Expires '+new Date(a.expires_at).toLocaleString())));if(filterKind==='all'||filterKind==='alerts'){if(!hits.length)list.innerHTML='<div class="note">No live hits right now. Expired alerts and tests are hidden.</div>';hits.slice(0,10).forEach(a=>{const e=document.createElement('div');e.className='card';e.innerHTML='<b>LIVE '+a.kind.toUpperCase()+' — '+a.retailer+'</b><div class="meta">Expires '+new Date(a.expires_at).toLocaleString()+'</div><p>'+a.title+'</p>';list.append(e)})}else shown.slice(0,20).forEach(s=>{const e=document.createElement('div');e.className='card';e.innerHTML='<b>'+s.name+'</b><div class="meta">'+s.address+'</div>';list.append(e)});map.fitBounds([home,...shown.map(s=>[s.lat,s.lng])],{padding:[38,38],maxZoom:12})}document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');filterKind=b.dataset.kind;render()});Promise.all([fetch('stores.json').then(r=>r.json()),fetch('alerts.json').then(r=>r.json()).catch(()=>[])]).then(([s,a])=>{stores=s.stores||[];alerts=a||[];render()});setInterval(render,60000);</script></body></html>
